experiment:
    repetitions: 1
    n_iterations: 100
    problem_names: ['ft20'] #['ft06', 'ft10', 'ft20']   #, 'abz7', 'abz8', 'abz9']
    log_path: ["..", "..", "logdata2", "Experiment"]
    experiment_id: 2
    dump_population: False

classical:
    _target_: base_nsga_ii.ClassicalNSGAII

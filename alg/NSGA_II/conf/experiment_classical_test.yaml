defaults:
- experiment: basic

experiment:
    repetitions: 1
    n_iterations: 150
    problem_names: ['ft20']

classical:
    _target_: base_nsga_ii.ClassicalNSGAII
    _partial_: True
    activate_logging: True
    pop_object:
        _target_: base_nsga_ii.ClassicalPopulation
        N: 50
        decoding_method: "apply_operation_based_bierwirth"
        activate_schedule: True
        tournament_size: 2
        mating_pool_size: 20
        mutation_probability: 0.3
    